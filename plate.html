<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D3 Fullscreen SVG Visualization</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Controls panel (radio buttons + sliders) -->
    <div
      id="controls"
      class="controls-panel"
      aria-label="Visualization controls"
    ></div>

    <!-- Container for the visualization. The script will create an SVG inside this div and make it fill the window. -->
    <div id="viz"></div>

    <!-- D3 from CDN -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- App script -->
    <script src="js/visualization.js"></script>
  </body>
</html>
